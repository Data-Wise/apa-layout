title: apa-layout
author: Davood Tofighi
version: 0.1.2
quarto-required: ">=1.9.0"
contributes:
  filters:
    # Each filter checks the output format (and, for jou, documentmode) itself,
    # so one `filters: [dtofighi/apa-layout]` line serves every apaquarto format.
    - path: latex-header.lua
    - path: typst-math.lua
    - at: post-render
      path: docx-tables.lua
    - path: docx-lists.lua
    - at: post-render
      path: jou-float-notes.lua

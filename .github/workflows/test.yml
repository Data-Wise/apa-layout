name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ragg (apaquarto's figure device) needs the -dev libraries; poppler-utils
      # provides pdftotext/pdfinfo for the stranded_titles check.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev libharfbuzz-dev libfribidi-dev poppler-utils

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "ragg", "svglite"))'

      # quarto looks up the latest TinyTeX release through the GitHub API; an
      # unauthenticated call is rate-limited (403) on shared runner IPs.
      - name: Install TinyTeX (LuaLaTeX)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          quarto install tinytex --no-prompt
          find "$HOME"/.TinyTeX/bin -mindepth 1 -maxdepth 1 -type d | head -1 >> "$GITHUB_PATH"

      - name: Layout checks
        run: tests/run.sh

      - name: Negative controls
        run: tests/prove-fail.sh

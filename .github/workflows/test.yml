name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # apaquarto renders figures with ragg, which needs these system libraries.
      - name: Install system libraries for ragg
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev libharfbuzz-dev libfribidi-dev

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "ragg", "svglite"))'

      - name: Install TinyTeX (LuaLaTeX)
        run: |
          quarto install tinytex --no-prompt
          find "$HOME"/.TinyTeX/bin -mindepth 1 -maxdepth 1 -type d | head -1 >> "$GITHUB_PATH"

      - name: Layout checks
        run: tests/run.sh

      - name: Negative controls
        run: tests/prove-fail.sh

name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # ragg (apaquarto's figure device) needs the -dev libraries; poppler-utils
      # provides pdftotext for the jou_pockets check.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev libharfbuzz-dev libfribidi-dev poppler-utils

      - name: Install R packages
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown", "ragg", "svglite"))'

      # quarto looks up the latest TinyTeX release through the GitHub API; an
      # unauthenticated call is rate-limited (403) on shared runner IPs, and the
      # token alone did not stop it (run 37532707075 failed with 403 on a docs-only
      # PR). Retry with a growing pause; only a real outage fails all attempts.
      - name: Install TinyTeX (LuaLaTeX)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            quarto install tinytex --no-prompt && break
            if [ "$attempt" -eq 5 ]; then echo "TinyTeX install failed after 5 attempts" >&2; exit 1; fi
            echo "TinyTeX install failed (attempt $attempt); retrying in $((attempt * 30))s" >&2
            sleep $((attempt * 30))
          done
          find "$HOME"/.TinyTeX/bin -mindepth 1 -maxdepth 1 -type d | head -1 >> "$GITHUB_PATH"

      - name: Layout checks
        run: tests/run.sh

      - name: Negative controls
        run: tests/prove-fail.sh
